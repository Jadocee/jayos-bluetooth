# Auto-connect A2DP on Bluetooth audio devices.
#
# Without this a speaker or receiver often connects with no profile selected,
# and exposes no sink until you pick one by hand -- which reads as the device
# pairing but producing no sound.
#
# SPA-JSON, which WirePlumber 0.5 reads from wireplumber.conf.d/; on 0.4
# nothing acts on it. There the equivalent was an apply_properties entry in
# bluez_monitor.rules, in a Lua file of your own under bluetooth.lua.d/, sorted
# after the packaged 50-bluez-config.lua that sets the table (and ships a
# bluez5.auto-connect example commented out). Not main.lua.d/, which this
# comment used to name: that directory holds the ALSA, libcamera and V4L2
# monitors and is loaded by main.conf as a separate Lua configuration, in
# which bluez_monitor -- created by bluetooth.lua.d/30-bluez-monitor.lua for
# bluetooth.conf -- does not exist. Read from the 0.4.17 package, not run.
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink a2dp_source ]
      }
    }
  }
]
