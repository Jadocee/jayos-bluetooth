# Bluetooth headsets: keep A2DP, and keep the good codec.
#
# WirePlumber 0.5 syntax (SPA-JSON in wireplumber.conf.d/). The 0.4 Lua rules
# do not load and are silently ignored, which looks identical to no config.
#
# The problems this solves, in order of how often they bite, and the key that
# solves each:
#
#   1. Any application that opens a capture stream -- a browser tab asking for
#      the microphone, a voice chat, a screen recorder -- makes WirePlumber
#      switch the headset from A2DP to HFP. Audio drops to 16kHz mono and
#      sounds broken. On a WH-1000XM5 that is the difference between LDAC and
#      a telephone. (wireplumber.settings, bluetooth.autoswitch-to-headset-profile)
#
#   2. Codec negotiation lands on SBC when the better ones are not offered
#      explicitly. (bluez5.codecs, and bluez5.a2dp.ldac.quality in the card rule)
#
#   3. Volume changes apply twice -- once in software, once on the headset --
#      so the usable range collapses into the bottom of the slider.
#      (bluez5.enable-hw-volume)
#
# Stutter is a fourth, handled by the node rule at the end of the file.

wireplumber.settings = {
  # THE important one, and a SETTING rather than a card property.
  #
  # WirePlumber 0.5's scripts/device/autoswitch-bluetooth-profile.lua gates
  # every hook it has on Settings.get_boolean("bluetooth.autoswitch-to-headset-
  # profile") and never reads a bluez5.* device property for it, so this key
  # works only here. Its schema (wireplumber.conf, wireplumber.settings.schema)
  # defaults it to true: leave it out and the switch happens.
  #
  # false means "do not switch to HFP because something opened a capture
  # stream". A browser tab that merely asks for microphone permission no
  # longer destroys playback quality.
  #
  # The cost: selecting the headset's microphone becomes a deliberate act in
  # the audio panel rather than something that happens to you. For a
  # WH-1000XM5 used for listening that is the right trade -- its microphone is
  # poor even in HFP.
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  # Offer the good codecs. The headset picks the best it supports, so listing
  # them all is safe on hardware that only speaks SBC.
  #
  # LDAC needs libldac and AAC needs libfdk-aac at build time; if PipeWire was
  # built without them the entry is ignored rather than failing.
  bluez5.codecs = [ ldac aac sbc_xq sbc ]

  # Hardware volume, so the slider drives the headset rather than attenuating
  # the stream before sending it. Without this, volume is applied twice and
  # everything above about 40% is already clipping-adjacent.
  bluez5.enable-hw-volume = true

  # The roles offered. a2dp_sink is listening; hfp_hf/hfp_ag are the headset
  # profile, kept so the microphone still works when explicitly selected --
  # the setting above stops it being selected automatically.
  #
  # No hsp_hs/hsp_ag. HSP is the pre-HFP profile (CVSD only, no mSBC, so it
  # could never use the mSBC setting below) and WirePlumber's own template
  # (bluetooth.conf, above its bluez5.roles example) warns that Sony 1000X
  # headsets (WH-1000XM3) misbehave when the PC advertises HSP AG next to
  # HFP AG. The HFP pair is PipeWire's own default (backend-native.c,
  # DEFAULT_ENABLED_PROFILES); the media roles are the A2DP and LE-audio
  # ones this desk uses. PipeWire's default media set (bluez5-dbus.c,
  # parse_roles) also enables asha_sink and the two BAP broadcast roles,
  # which this list drops -- the key narrows the default, it never widens it.
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag ]

  # mSBC rather than CVSD when HFP is used deliberately: 16kHz instead of 8kHz.
  bluez5.hfphsp-backend = native
  bluez5.enable-msbc = true
}

monitor.bluez.rules = [
  {
    matches = [
      {
        # Every Bluetooth device. Named rules per address would break the
        # moment the headset is re-paired.
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        # LDAC quality. A DEVICE property: the LDAC encoder reads it from the
        # card's settings (PipeWire a2dp-codec-ldac.c init_props, called from
        # media-sink.c with transport->device->settings), and those are built
        # from the props a monitor.bluez.rules update-props applies. Under
        # monitor.bluez.properties the same key is silently ignored.
        #
        # `auto` drops to a lower bitrate as the link degrades, which is what
        # you want on a desk with a 2.4GHz keyboard and a Wi-Fi card nearby.
        # `hq` holds 990kbps and stutters instead.
        bluez5.a2dp.ldac.quality = "auto"
      }
    }
  }

  # ── buffering, which is what stutter usually comes down to ───────────────
  #
  # PipeWire's defaults are tuned for local audio, where a small quantum buys
  # low latency at no cost. A Bluetooth link is not that: packets are
  # retransmitted, the radio shares a band with Wi-Fi, and the quantum that
  # never underruns on a sound card underruns constantly over the air.
  #
  # Matched on the SINK node, not the card: these are node properties, and
  # setting them on the card does nothing at all.
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        # About 21ms at 48kHz. Inaudible for music, and enough room to absorb
        # a retransmit; the default of 256 leaves none.
        #
        # The latency this adds would matter for a call, which runs on the
        # headset profile rather than this one.
        node.latency = "1024/48000"

        # Never suspended.
        #
        # PipeWire idles a node after a few seconds of silence and powers the
        # link down. The first second of the next track then arrives while the
        # link renegotiates, heard as a stutter at the start of everything --
        # and usually blamed on the codec.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
