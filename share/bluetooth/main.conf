# BlueZ, for high-quality headphones: installed whole as /etc/bluetooth/main.conf
# by install.d/60-system.sh, without asking, whenever the file there differs.
#
# The whole file, because it is the only one bluetoothd reads: load_config in
# BlueZ's src/main.c opens <configdir>/main.conf and nothing else (read in
# 5.87), so there is no main.conf.d to drop a file into. Earlier versions of
# the installer put this at /etc/bluetooth/main.conf.d/50-quickshell.conf,
# where nothing read it, and the step removes that file now. Every key not set
# here takes BlueZ's default, which is all upstream's own main.conf gives a
# stock machine: every line of it is a comment.
#
# Replacing a packaged file survives upgrades: Arch's bluez lists
# etc/bluetooth/main.conf in backup=, so pacman leaves a changed copy in place
# and puts the new default beside it as main.conf.pacnew. The first time the
# step replaces it, the file as it was is kept as main.conf.jayos-orig.

[General]
# Battery reporting.
#
# The WH-1000XM5 reports its battery over AVRCP vendor commands. BlueZ only
# exposes the Battery Provider interface with experimental features on, so
# without this the level is simply not available to anything -- upower, the
# shell, or bluetoothctl. It is not that the headphones do not report it.
Experimental = true

# Reconnect without waiting for a scan window.
#
# Off, an already-paired device can take several seconds to reconnect after
# leaving and re-entering range, which reads as the headphones being flaky.
# It costs a small amount of idle power on the adapter.
FastConnectable = true

# Both classic and LE. The XM5 pairs over classic Bluetooth for audio but uses
# LE for the companion app and some control channels, and dual is the default
# on most adapters anyway -- stated so a controller defaulting otherwise does
# not silently lose half its function.
ControllerMode = dual

# How long, in seconds, bluetoothd keeps a temporary device (one a scan found
# and nothing has since paired, connected to or blocked) before forgetting it;
# 0 keeps them forever. 30 is upstream's default (BlueZ's main.conf says
# "Default is 30"), so on a stock main.conf this changes nothing. It is set so
# that a main.conf with 0 cannot make every device that ever passed within
# range a permanent entry in the device list.
TemporaryTimeout = 30

[Policy]
# Reconnect audio profiles automatically after a disconnect.
#
# Without reconnection, headphones that drop out of range come back as a paired
# device with no active profile -- connected, and producing no sound until you
# toggle them by hand. Both values are the ones BlueZ's main.conf lists as its
# commented defaults, so on a stock file this changes nothing; they are set
# so that a main.conf with ReconnectAttempts=0 gets reconnection back.
ReconnectAttempts = 7
ReconnectIntervals = 1, 2, 4, 8, 16, 32, 64
# AutoEnable is deliberately absent.
#
# It has been true by stock default since BlueZ 5.65, so setting it here says
# nothing. Setting it FALSE is the tempting mistake -- it looks like it would
# persist "Bluetooth off" across a reboot, and BlueZ has no such behaviour, so
# all it buys is the adapter coming up off every boot with nothing restoring it.
#
# The power state lives in the rfkill soft block instead: systemd-rfkill saves
# every switch under /var/lib/systemd/rfkill and restores it early on the next
# boot. Leaving AutoEnable alone is what lets bluetoothd bring the adapter back
# up when that block is lifted.
#
# This reasoning is omarchy's, from install/hardware/bluetooth.sh, and it is
# right -- fix.sh unblocks rfkill before touching bluetoothctl for the same
# reason: `bluetoothctl power on` fails outright while a block is set.
